<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Unmatched Ego 2</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#unity-canvas{width:100%;height:100%;background:#111;outline:none;object-fit:contain}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,80vw);text-align:center;z-index:2}
#bar{height:10px;background:#444;border-radius:10px;overflow:hidden;margin-top:12px}#fill{height:100%;width:0;background:#fff;transition:width .15s}
#status{font-size:14px;margin-top:10px;color:#ddd}#error{display:none;color:#ff9b9b;white-space:pre-wrap;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div id="game"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="loading"><strong>Loading Unmatched Ego 2…</strong><div id="bar"><div id="fill"></div></div><div id="status">Preparing game</div><div id="error"></div></div>
<script>
// Lightweight compatibility shim for the CrazyGames SDK calls made by the game.
window.Crazygames=window.Crazygames||{
 load:function(){},
 init:function(options){
  window.__crazyOptions=options||{};
  var cb=options&&options.crazySDKObjectName;
  if(cb&&window.unityGameInstance){try{window.unityGameInstance.SendMessage(cb,'InitCallback',JSON.stringify({gameLink:location.href,userInfo:{countryCode:'US',device:{type:'desktop'},os:{name:'Unknown'},browser:{name:'Unknown'}}}));}catch(e){}}
 },
 requestAd:function(){},happytime:function(){},gameplayStart:function(){},gameplayStop:function(){},
 sdkGameLoadingStart:function(){},sdkGameLoadingStop:function(){},requestInviteUrl:function(){},requestBanners:function(){},
 screenshotReceived:function(){},constants:[],getUnityInstance:function(){return window.unityGameInstance||null;}
};
window.CrazySDK=window.CrazySDK||{init:function(o){window.Crazygames.init(o)},requestAd:function(t){window.Crazygames.requestAd(t)}};
</script>
<script>
(function(){
 const canvas=document.getElementById('unity-canvas');
 const loading=document.getElementById('loading');
 const fill=document.getElementById('fill');
 const status=document.getElementById('status');
 const error=document.getElementById('error');
 const build='https://l0wm00n.github.io/Unmatched-Ego-2/Unmatched-Ego-2-CodeHS/Build/';
 const config={
  dataUrl:build+'8e5a9367877d6919bd40173a76a5bb10.data.br',
  frameworkUrl:build+'55974dc5d2ef6b7ea464eed33e1bd0d2.framework.js.br',
  codeUrl:build+'de7a79da0ff34d64d663e0b211d93907.wasm.br',
  streamingAssetsUrl:'https://l0wm00n.github.io/Unmatched-Ego-2/Unmatched-Ego-2-CodeHS/StreamingAssets',
  companyName:'',productName:'Unmatched Ego 2',productVersion:'63',
  showBanner:function(message,type){if(type==='error')fail(message);else status.textContent=message;},
  matchWebGLToCanvasSize:true
 };
 function fail(e){loading.style.display='block';status.textContent='The game could not start.';error.style.display='block';error.textContent=(e&&e.message)||String(e);}
 const script=document.createElement('script');
 script.src=build+'976220bf21c7964a357cbc738e0ed4b7.loader.js';
 script.onerror=()=>fail('Could not load the Unity loader from GitHub Pages. Check that Pages is published and that the Build folder and loader filename are present at: '+build);
 script.onload=()=>{
  if(typeof createUnityInstance!=='function')return fail('Unity loader did not initialize.');
  createUnityInstance(canvas,config,p=>{fill.style.width=(100*p)+'%';status.textContent='Loading game… '+Math.round(p*100)+'%';})
   .then(instance=>{window.unityGameInstance=instance;loading.style.display='none';})
   .catch(fail);
 };
 document.body.appendChild(script);
})();
</script>
</body>
</html>
