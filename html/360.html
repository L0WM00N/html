<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#565658">
  <link rel="icon" href="uploads/Xbox_Live__trsp_.png">
  <title>Xbox 360</title>
  <link rel="stylesheet" href="/html/360/styles.css">
  <link rel="stylesheet" href="/html/360/notification.css">
  <link rel="stylesheet" href="/html/360/guide.css">
  <link rel="stylesheet" href="/html/360/achievements.css">
</head>
<body>
  <main id="dashboard" aria-label="Xbox 360 dashboard">
    <div id="stage" class="prelaunch">
      <div id="dashboard-view">
        <button id="player-badge" type="button" aria-label="Player profile">
          <span id="player-badge-name"></span>
          <img src="/html/360/uploads/profilePicture.png" alt="Player picture">
        </button>
        <nav id="tabs" aria-label="Dashboard sections"></nav>
        <div id="rail"></div>
        <footer><span id="select-hint"><i class="key a">A</i> Select</span><button id="back-hint" hidden><i class="key b">B</i> Back</button><button id="settings-extra-hint" type="button" hidden></button></footer>
      </div>
      <section id="settings-screen" hidden></section>
      <section id="games-screen" aria-label="My Games" hidden>
        <h1>My Games</h1>
        <div class="games-library">
          <button id="owned-minecraft" class="owned-game" type="button" aria-label="Launch Minecraft: Xbox 360 Edition">
            <img src="/html/360/uploads/minecraftGameCover.png" alt="">
            <span>Minecraft: Xbox 360 Edition</span>
            <small id="minecraft-achievement-progress" class="game-progress" aria-label="0 of 20 achievements, 0 of 400 Gamerscore">
              <span class="achievement-count">0/20</span>
              <svg class="progress-trophy" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 2h6v5a3 3 0 0 1-6 0V2Zm0 1H2v2c0 2 1 3 4 3m5-5h3v2c0 2-1 3-4 3M8 10v3m-3 1h6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="gamerscore-count">0/400</span><span class="gamerscore-mark" aria-hidden="true">G</span>
            </small>
          </button>
          <button id="owned-forza" class="owned-game" type="button" aria-label="Forza Horizon">
            <img src="/html/360/uploads/ForzaHorizonCoverArt.png" alt="">
            <span>Forza Horizon</span>
          </button>
          <button id="owned-f1" class="owned-game" type="button" aria-label="F1 2012">
            <img src="/html/360/uploads/F12012CoverArt.png" alt="">
            <span>F1 2012</span>
          </button>
          <button id="owned-witcher" class="owned-game" type="button" aria-label="The Witcher 2: Assassins of Kings">
            <img src="/html/360/uploads/witcher2coverart.png" alt="">
            <span>The Witcher 2: Assassins of Kings</span>
          </button>
          <button id="owned-sonic" class="owned-game" type="button" aria-label="Sonic Free Riders">
            <img src="/html/360/uploads/SonicFreeRidersCoverArt.png" alt="">
            <span>Sonic Free Riders</span>
          </button>
        </div>
        <footer><span><i class="key a">A</i> Launch</span><button id="games-achievements" type="button"><i class="key x">X</i> Achievements</button><button id="games-back" type="button"><i class="key b">B</i> Back</button></footer>
      </section>
      <div id="boot-toast" class="boot-toast" role="status" aria-live="polite" aria-atomic="true" hidden>
        <div class="toast-window"><span id="boot-toast-text"></span></div>
        <div class="toast-symbol" aria-hidden="true">
          <span class="toast-halo"></span>
          <svg class="toast-ring" viewBox="0 0 76 76">
            <defs>
              <linearGradient id="toast-metal" x2="0" y2="1"><stop stop-color="#e0e2df"/><stop offset=".35" stop-color="#737974"/><stop offset="1" stop-color="#343934"/></linearGradient>
              <linearGradient id="toast-green" x2="0" y2="1"><stop stop-color="#c9f878"/><stop offset=".48" stop-color="#91d53e"/><stop offset="1" stop-color="#4b921c"/></linearGradient>
              <linearGradient id="toast-unlit" x2="0" y2="1"><stop stop-color="#848b82"/><stop offset="1" stop-color="#494f48"/></linearGradient>
            </defs>
            <circle cx="38" cy="38" r="36" fill="url(#toast-metal)" stroke="#b1b5ae" stroke-width="1"/>
            <circle cx="38" cy="38" r="32.5" fill="#0c100c"/>
            <g fill="none" stroke-width="6.5">
              <path d="M 9 34 A 29 29 0 0 1 34 9" stroke="url(#toast-green)"/>
              <path d="M 42 9 A 29 29 0 0 1 67 34" stroke="url(#toast-unlit)"/>
              <path d="M 67 42 A 29 29 0 0 1 42 67" stroke="url(#toast-unlit)"/>
              <path d="M 34 67 A 29 29 0 0 1 9 42" stroke="url(#toast-unlit)"/>
            </g>
          </svg>
          <div class="toast-face">
            <img src="/html/360/uploads/xbox-360-games-vector-logo-400x400.png" alt="">
          </div>
        </div>
      </div>
    </div>
    <section id="minecraft-screen" aria-label="Minecraft" hidden>
      <iframe id="minecraft-frame" title="Minecraft" allow="autoplay; fullscreen 'none'"></iframe>
    </section>
    <button id="system-guide-button" type="button" aria-label="Open Xbox Guide" title="Xbox Guide" hidden><img class="guide-logo" src="/html/360/uploads/xbox-360-games-vector-logo-400x400.png" alt=""></button>
    <div id="system-layer" hidden><div id="system-stage"><div id="overlay" hidden></div></div></div>
    <div id="black-screen" hidden></div>
    <div id="boot-screen" hidden><video id="boot-video" src="/html/360/uploads/xbox-360-intro.mp4" playsinline preload="auto"></video></div>
    <div id="launch-screen">
      <div class="launch-content">
        <button id="launch-button" type="button" disabled>Loading assets…</button>
        <section class="launch-controls" aria-labelledby="launch-controls-title">
          <h2 id="launch-controls-title">Keyboard controls</h2>
          <div class="launch-control"><span><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>Navigate</span></div>
          <div class="launch-control"><span><kbd>Enter</kbd></span><span>Select</span></div>
          <div class="launch-control"><span><kbd>Esc</kbd> or <kbd>Backspace</kbd></span><span>Back</span></div>
          <div class="launch-control"><span><kbd>Q</kbd> / <kbd>E</kbd> or <kbd>PgUp</kbd> / <kbd>PgDn</kbd></span><span>Change tabs</span></div>
          <div class="launch-control"><span><kbd>Home</kbd></span><span>Xbox Guide</span></div>
          <div class="launch-control"><span><kbd>X</kbd> / <kbd>Y</kbd></span><span>Context actions</span></div>
          <p>Best used with an Xbox controller or any XInput controller device.</p>
        </section>
      </div>
    </div>
    <div id="controller-status" role="status" hidden></div>
    <div id="rotate-screen" role="status" aria-live="polite"><span class="rotate-icon" aria-hidden="true">▯</span><span>Rotate your device to landscape</span></div>
  </main>
  <script type="module" src="/html/360/app.js"></script>
</body>
</html>
