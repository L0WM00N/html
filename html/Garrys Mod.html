<!DOCTYPE html>

<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/organization-schoogls/y@main/style.css"/>

<style>
        /* Убираем выделение по нажатию клавиш */
        canvas:focus {
            outline: none;
        }

        html, body {
            /* Убираем отступы */
            padding: 0;
            margin: 0;
            /* Отключаем скролл и лонгтап на IOS */
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            /* Ставим высоту на 100% */
            height: 100%;
        }
    </style>
<!-- Additional head modules -->
</head>
<body class="dark">
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-cover" style="display:none;">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@287710a4fac80d3ea9187e9d27c8358034b2639b/pdctrsh91fc91.jpg"/></div>
<div id="unity-progress-bar-empty" style="display: none;">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner"></div>
</div>
</div>
<!-- Additional body modules -->
<div id="gm-log"></div>
<style>
#gm-log{position:fixed;left:8px;bottom:8px;z-index:99999;max-width:min(620px,96vw);max-height:45vh;overflow:hidden;padding:6px 10px;font:12px/1.4 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.78);color:#ddd;border-radius:6px;pointer-events:none;white-space:pre-wrap;word-break:break-word}
#gm-log:empty{display:none}
.gm-bad{color:#ff7b7b}.gm-warn{color:#ffd166}.gm-ok{color:#7ee787}
</style>
<script>
        // ===== Added: on-screen log (bottom-left) =====
        const gmBox = document.getElementById("gm-log");
        let gmHadError = false, gmRejections = 0;
        function gmLog(text, kind) {
            console[kind === "bad" ? "error" : "log"]("[GM] " + text);
            if (kind === "bad") gmHadError = true;
            if (!gmBox) return;
            const line = document.createElement("div");
            line.className = "gm-" + (kind || "info");
            line.textContent = text;
            gmBox.appendChild(line);
            gmBox.scrollTop = gmBox.scrollHeight;
        }
        function gmAutoHide() {
            if (!gmHadError && gmBox) setTimeout(() => { gmBox.style.display = "none"; }, 5000);
        }
        window.addEventListener("error", (e) => { if (e && e.message) gmLog("Page error: " + e.message, "warn"); });
        const hideFullScreenButton = "";
        let buildUrl = "https://cdn.jsdelivr.net/gh/organization-schoogls/y@main/Build";
        let loaderUrl = buildUrl + "/build.loader.js";
        const config = {
            dataUrl: buildUrl + "/build.data.unityweb",
            frameworkUrl: buildUrl + "/build.framework.js.unityweb",
            codeUrl: buildUrl + "/build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
            companyName: "AutismDev",
            productName: "Gravity Mod",
            productVersion: "1.0.0.0"
        };

       const container = document.querySelector("#unity-container");
        const canvas = document.querySelector("#unity-canvas");
        const loadingCover = document.querySelector("#loading-cover");
        const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");
        const spinner = document.querySelector('.spinner');

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            container.className = "unity-mobile";
        }

        loadingCover.style.background = "url('https://cdn.jsdelivr.net/gh/organization-schoogls/y@main/background.gif') center / cover";
        loadingCover.style.display = "";

        document.addEventListener('contextmenu', event => event.preventDefault());

        function FocusGame() {
            window.focus();
            canvas.focus();
        }

        window.addEventListener('pointerdown', FocusGame);
        window.addEventListener('touchstart', FocusGame);

        let StartUnityInstance;
        let myGameInstance;
        let ysdk = null; // Yandex SDK pasif

        // Varsayılan değerlerle environmentData, cloudSaves, paymentsData ve playerData gibi değişkenlerin tanımlanması
        let environmentData = {
            language: "en",
            domain: "default_domain",
            deviceType: "desktop",
            isMobile: false,
            isDesktop: true,
            isTablet: false,
            isTV: false,
            appID: "default_app_id",
            browserLang: navigator.language || "en",
            payload: null,
            promptCanShow: false,
            reviewCanShow: false,
            platform: navigator.platform,
            browser: (function() {
                let userAgent = navigator.userAgent;
                if (userAgent.includes("YaBrowser")) return "Yandex";
                if (userAgent.includes("OPR") || userAgent.includes("Opera")) return "Opera";
                if (userAgent.includes("Firefox")) return "Firefox";
                if (userAgent.includes("MSIE") || userAgent.includes("Trident")) return "IE";
                if (userAgent.includes("Edge")) return "Edge";
                if (userAgent.includes("Chrome")) return "Chrome";
                if (userAgent.includes("Safari")) return "Safari";
                return "Other";
            })()
        };
        
        let cloudSaves = 'noData';
        let paymentsData = 'none';
        let playerData = 'noData'; // Varsayılan playerData tanımı
        let player = null;
        let payments = null;
        let initGame = false;
        let nowFullAdOpen = false;

        // Eksik olabilecek tüm SDK işlevlerini varsayılan olarak tanımla
        function GetPayments() { console.warn("GetPayments is not implemented"); return Promise.resolve("none"); }
        function SaveCloud() { console.warn("SaveCloud is not implemented"); }
        function LoadCloud() { console.warn("LoadCloud is not implemented"); return Promise.resolve("noData"); }
        function InitPlayer() { console.warn("InitPlayer is not implemented"); return Promise.resolve("noData"); }
        function FullAdShow() { console.warn("FullAdShow is not implemented"); }
        function RewardedShow() { console.warn("RewardedShow is not implemented"); }
        function StickyAdActivity() { console.warn("StickyAdActivity is not implemented"); }
        function Review() { console.warn("Review is not implemented"); }
        function PromptShow() { console.warn("PromptShow is not implemented"); }
        function InitLeaderboards() { console.warn("InitLeaderboards is not implemented"); }
        function GetLeaderboardScores() { console.warn("GetLeaderboardScores is not implemented"); }
        function SetLeaderboardScores() { console.warn("SetLeaderboardScores is not implemented"); }
        function ConsumePurchase() { console.warn("ConsumePurchase is not implemented"); }
        function ConsumePurchases() { console.warn("ConsumePurchases is not implemented"); } // Varsayılan tanım eklendi

        // ===== Added: on-screen diagnostics + download-source fallback =====
        const GM_HOSTS = ["cdn", "fastly", "gcore", "testingcf"];   // jsDelivr mirrors, tried in order
        const GM_PATH = "/gh/organization-schoogls/y@main/Build";
        const GM_FILES = ["build.loader.js", "build.framework.js.unityweb", "build.data.unityweb", "build.wasm.unityweb"];

        function gmEnvReport() {
            try {
                const c = document.createElement("canvas");
                const gl = c.getContext("webgl2");
                gmLog("WebGL2: " + (gl ? "yes" : "NO (Unity needs it)"), gl ? "" : "bad");
                if (gl) { const x = gl.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); }
            } catch (e) { gmLog("WebGL2 check failed: " + e.message, "bad"); }
            gmLog("Memory: " + (navigator.deviceMemory ? navigator.deviceMemory + " GB (rounded)" : "unknown") + ", CPU cores: " + (navigator.hardwareConcurrency || "?"));
            try {
                const r = indexedDB.open("gm-diag");
                r.onsuccess = () => { gmLog("Browser storage (IndexedDB): ok"); r.result.close(); indexedDB.deleteDatabase("gm-diag"); };
                r.onerror = () => gmLog("Browser storage (IndexedDB): blocked", "warn");
            } catch (e) { gmLog("Browser storage (IndexedDB): blocked (" + e.message + ")", "warn"); }
        }

        // Asks a mirror for the first byte of each build file, so a blocked or refused host is found quickly.
        async function gmProbe(host) {
            const base = "https://" + host + ".jsdelivr.net" + GM_PATH + "/";
            for (const file of GM_FILES) {
                const t0 = performance.now();
                const ctl = new AbortController();
                const timer = setTimeout(() => ctl.abort(), 15000);
                try {
                    const res = await fetch(base + file, { headers: { Range: "bytes=0-0" }, cache: "no-store", credentials: "omit", signal: ctl.signal });
                    if (res.body) res.body.cancel().catch(() => {});
                    if (res.status !== 200 && res.status !== 206) {
                        gmLog(host + ": " + file + " -> HTTP " + res.status, "bad");
                        return false;
                    }
                    gmLog(host + ": " + file + " ok (" + Math.round(performance.now() - t0) + " ms)");
                } catch (e) {
                    gmLog(host + ": " + file + " -> " + (e.name === "AbortError" ? "timed out" : "blocked or failed (" + e.message + ")"), "bad");
                    return false;
                } finally {
                    clearTimeout(timer);
                }
            }
            return true;
        }

        function gmStartUnity() {
            let last = -1, milestone = -1, lastChange = performance.now();
            const dog = setInterval(() => {
                if (performance.now() - lastChange > 20000) {
                    gmLog("No progress for 20 s (stuck at " + Math.round(Math.max(last, 0) * 100) + "%)", "warn");
                    lastChange = performance.now();
                }
            }, 5000);
            gmLog("Starting Unity…");
            createUnityInstance(canvas, config, (progress) => {
                spinner.style.display = "none";
                progressBarEmpty.style.display = "";
                progressBarFull.style.width = `${100 * progress}%`;
                if (progress !== last) { last = progress; lastChange = performance.now(); }
                const m = Math.floor(progress * 4);
                if (m !== milestone) { milestone = m; gmLog("Loading " + Math.round(progress * 100) + "%"); }
            }).then((unityInstance) => {
                clearInterval(dog);
                myGameInstance = unityInstance;
                loadingCover.style.display = "none";
                gmLog("Game started.", "ok");
                gmAutoHide();
            }).catch((message) => {
                clearInterval(dog);
                console.error("Unity yükleme hatası:", message);
                gmLog("Unity failed to start: " + String((message && message.message) || message), "bad");
            });
        }

        async function gmBoot() {
            gmEnvReport();
            let chosen = null;
            for (const host of GM_HOSTS) {
                gmLog("Checking " + host + ".jsdelivr.net…");
                if (await gmProbe(host)) { chosen = host; break; }
            }
            if (chosen) {
                gmLog("Using " + chosen + ".jsdelivr.net");
            } else {
                gmLog("No source passed the check; trying cdn anyway.", "bad");
                chosen = "cdn";
            }
            buildUrl = "https://" + chosen + ".jsdelivr.net" + GM_PATH;
            loaderUrl = buildUrl + "/build.loader.js";
            config.dataUrl = buildUrl + "/build.data.unityweb";
            config.frameworkUrl = buildUrl + "/build.framework.js.unityweb";
            config.codeUrl = buildUrl + "/build.wasm.unityweb";
            config.showBanner = (msg, type) => gmLog("Unity " + type + ": " + msg, type === "error" ? "bad" : "warn");
            const script = document.createElement("script");
            script.src = loaderUrl;
            script.onerror = () => gmLog("Could not load build.loader.js from " + chosen + ".jsdelivr.net", "bad");
            script.onload = () => {
                StartUnityInstance = gmStartUnity;
                StartUnityInstance();
            };
            document.body.appendChild(script);
        }

        function InitGame() {
            try {
                console.log('Init Game Success');
                initGame = true;
                if (nowFullAdOpen === true && myGameInstance != null) {
                    myGameInstance.SendMessage('YandexGame', 'OpenFullAd');
                }
            } catch (error) {
                console.error("InitGame sırasında hata:", error);
            }
        }

        // Hata oluştuğunda oyuna devam etmek için tüm hataları global olarak yakalayan yapı
        window.addEventListener("unhandledrejection", function(event) {
            console.warn("Hata es geçildi:", event.reason);
            if (gmRejections++ < 3) gmLog("Ignored error: " + String((event.reason && event.reason.message) || event.reason), "warn");
            event.preventDefault();
        });
        gmBoot().catch((e) => gmLog("Startup error: " + e.message, "bad"));
    </script>
</body>
</html>
