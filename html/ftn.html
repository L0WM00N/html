<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>FindTheNeedle</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080808;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }
    #fallback {
      position: fixed;
      z-index: 2;
      right: 12px;
      top: 12px;
      padding: 8px 12px;
      border: 1px solid #555;
      border-radius: 6px;
      background: rgba(0,0,0,.72);
      color: white;
      font: 13px system-ui, sans-serif;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <a id="fallback" href="https://nawsif.github.io/FindTheNeedle/" target="_blank" rel="noopener">
    Open game directly
  </a>

  <iframe
    id="game"
    src="https://nawsif.github.io/FindTheNeedle/"
    title="FindTheNeedle"
    allow="autoplay; fullscreen; gamepad; pointer-lock"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</body>
</html>
